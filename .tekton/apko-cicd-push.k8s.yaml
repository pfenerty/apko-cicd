apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-path-changed: "[base/**, tools/**, languages/**]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/task: "[.tekton/tasks/set-status-pending-push.k8s.yaml, .tekton/tasks/git-clone.k8s.yaml, .tekton/tasks/detect-changed-images.k8s.yaml, .tekton/tasks/build-publish-image.k8s.yaml, .tekton/tasks/reconcile-status-push.k8s.yaml]"
  name: apko-cicd-push
spec:
  params:
    - name: project-name
      value: "{{ repo_name }}"
    - name: repo-full-name
      value: "{{ repo_owner }}/{{ repo_name }}"
    - name: source-branch
      value: "{{ source_branch }}"
    - name: revision
      value: "{{ revision }}"
    - name: url
      value: "{{ repo_url }}"
  pipelineSpec:
    finally:
      - name: reconcile-status-push
        params:
          - name: repo-full-name
            value: $(params.repo-full-name)
          - name: revision
            value: $(params.revision)
          - name: pipeline-run-name
            value: $(context.pipelineRun.name)
          - name: status-detect-changed-images
            value: $(tasks.detect-changed-images.status)
          - name: status-build-publish-image
            value: $(tasks.build-publish-image.status)
        taskRef:
          kind: Task
          name: apko-cicd-reconcile-status-push
    params:
      - description: Repository name, bound by PAC from repo_name
        name: project-name
        type: string
      - description: Repository owner/name, bound by PAC from repo_owner and repo_name
        name: repo-full-name
        type: string
      - description: Branch or tag ref of the event, bound by PAC from source_branch
        name: source-branch
        type: string
      - name: revision
        type: string
      - description: Repository URL to clone from
        name: url
        type: string
    tasks:
      - name: set-status-pending-push
        params:
          - name: repo-full-name
            value: $(params.repo-full-name)
          - name: revision
            value: $(params.revision)
          - name: pipeline-run-name
            value: $(context.pipelineRun.name)
        runAfter:
          - git-clone
        taskRef:
          kind: Task
          name: apko-cicd-set-status-pending-push
      - name: git-clone
        params:
          - name: url
            value: $(params.url)
          - name: revision
            value: $(params.revision)
        taskRef:
          kind: Task
          name: apko-cicd-git-clone
        workspaces:
          - name: workspace
            workspace: workspace
      - name: detect-changed-images
        params:
          - name: repo-full-name
            value: $(params.repo-full-name)
          - name: revision
            value: $(params.revision)
          - name: pipeline-run-name
            value: $(context.pipelineRun.name)
        runAfter:
          - set-status-pending-push
        taskRef:
          kind: Task
          name: apko-cicd-detect-changed-images
        workspaces:
          - name: workspace
            workspace: workspace
      - matrix:
          params:
            - name: unit
              value: $(tasks.detect-changed-images.results.units[*])
        name: build-publish-image
        params:
          - name: repo-full-name
            value: $(params.repo-full-name)
          - name: revision
            value: $(params.revision)
          - name: pipeline-run-name
            value: $(context.pipelineRun.name)
        runAfter:
          - detect-changed-images
          - set-status-pending-push
        taskRef:
          kind: Task
          name: apko-cicd-build-publish-image
        workspaces:
          - name: workspace
            workspace: workspace
    workspaces:
      - name: workspace
  taskRunTemplate:
    podTemplate:
      env:
        - name: HOME
          value: /tekton/home
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
    serviceAccountName: default
  timeouts:
    pipeline: 3h
  workspaces:
    - name: workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: local-path
